# DO1KRT Weltzeituhr – Netlify + Edge SSR (Zeiten ohne JS)

[build]
  publish = "."
  command = "echo static+edge"

# Edge Function liefert HTML mit fertigen Zeiten (QRZ-Sandbox-sicher)
[[edge_functions]]
  function = "clock"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=10, must-revalidate"
